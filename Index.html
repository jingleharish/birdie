<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court: #0E4D3C;
    --court-dark: #0A3A2D;
    --cream: #F5F1E4;
    --feather-red: #C1392B;
    --gold: #D4A017;
    --ink: #08251C;
    --muted: rgba(245,241,228,0.5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; overflow:hidden; background:#000;}
  body{
    font-family:'Barlow Condensed', sans-serif;
    color: var(--cream);
    display:flex; flex-direction:column;
    width:100vw; height:100vh;
  }

  /* Safe circular padding for round bezels */
  .wrap{
    flex:1; display:flex; flex-direction:column;
    padding: 13% 10%;
    height:100%; width:100%;
  }

  .topline{
    display:flex; justify-content:center; align-items:center;
    font-size: 3.2vh; font-weight:700; color: var(--muted);
    letter-spacing:0.02em; margin-bottom: 1vh;
  }
  .topline b{ color: var(--gold); margin: 0 4px; }

  .court{
    flex:1; display:flex; border-radius: 18px; overflow:hidden;
    border: 1.5px solid rgba(245,241,228,0.15);
  }
  .side{
    flex:1; background: var(--court);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; gap: 0.5vh;
    transition: background 0.15s ease;
  }
  .side:first-child{ border-right: 1.5px solid rgba(245,241,228,0.18); }
  .side:active{ background: rgba(245,241,228,0.12); }

  .serve-dot{
    width: 1.8vh; height:1.8vh; border-radius:50%;
    background: var(--feather-red);
    box-shadow: 0 0 0 2.5px rgba(193,57,43,0.3);
    position:absolute; top: 8%;
  }
  .serve-dot.hidden{ visibility:hidden; }

  .score{
    font-family:'Archivo Black', sans-serif;
    font-size: 9vh;
    line-height:1;
    color: var(--cream);
  }
  .side.leading .score{ color: var(--gold); }

  .label{
    font-size: 2vh; font-weight:600; letter-spacing:0.03em;
    color: var(--muted); text-transform:uppercase;
  }
  .sub{
    font-size: 1.7vh; font-weight:700; letter-spacing:0.05em;
    color: var(--feather-red); min-height: 2vh;
  }

  .bottomrow{
    display:flex; justify-content:center; gap: 6%;
    margin-top: 1.4vh;
  }
  .mini-btn{
    background: rgba(245,241,228,0.1);
    color: var(--cream); border: 1px solid rgba(245,241,228,0.2);
    border-radius: 14px; font-family:'Barlow Condensed'; font-weight:700;
    font-size: 1.8vh; padding: 1vh 3vw;
  }
  .mini-btn:active{ background: rgba(245,241,228,0.22); }
  .mini-btn.gold{ background: var(--gold); color: var(--ink); border-color: var(--gold); }

  .toast{
    position:fixed; top: 6%; left:50%; transform:translateX(-50%);
    background: var(--gold); color: var(--ink); font-weight:700;
    font-size: 1.9vh; padding: 0.8vh 3vw; border-radius: 20px;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease; z-index:20;
  }
  .toast.show{ opacity:1; }

  .setup{
    position:fixed; inset:0; background: var(--court-dark);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 1.6vh; padding: 14%; z-index:30; text-align:center;
  }
  .setup.hidden{ display:none; }
  .setup p{ font-size: 2vh; color: var(--muted); margin:0; }
  .setup .mini-btn{ font-size: 2.2vh; padding: 1.4vh 5vw; }
</style>
</head>
<body>

  <div class="setup" id="setup">
    <p>First serve?</p>
    <div style="display:flex; gap:4vw;">
      <button class="mini-btn gold" id="firstA">A</button>
      <button class="mini-btn gold" id="firstB">B</button>
    </div>
  </div>

  <div class="wrap">
    <div class="topline">GAMES <b id="gamesLabel">0–0</b></div>
    <div class="court">
      <div class="side" id="sideA">
        <div class="serve-dot hidden" id="serveA"></div>
        <div class="label">A</div>
        <div class="score" id="scoreA">0</div>
        <div class="sub" id="subA"></div>
      </div>
      <div class="side" id="sideB">
        <div class="serve-dot hidden" id="serveB"></div>
        <div class="label">B</div>
        <div class="score" id="scoreB">0</div>
        <div class="sub" id="subB"></div>
      </div>
    </div>
    <div class="bottomrow">
      <button class="mini-btn" id="undoBtn">Undo</button>
      <button class="mini-btn" id="soundBtn">🔊</button>
      <button class="mini-btn" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const state = { scoreA:0, scoreB:0, server:'A', gamesA:0, gamesB:0, history:[], soundOn:true };
  const el = id => document.getElementById(id);
  const scoreAEl = el('scoreA'), scoreBEl = el('scoreB');
  const sideA = el('sideA'), sideB = el('sideB');
  const serveA = el('serveA'), serveB = el('serveB');
  const subA = el('subA'), subB = el('subB');
  const gamesLabel = el('gamesLabel');
  const toastEl = el('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 1100);
  }

  function checkGameOver(){
    const a = state.scoreA, b = state.scoreB;
    const leader = Math.max(a,b), gap = Math.abs(a-b);
    if (leader >= 21 && gap >= 2) return a > b ? 'A' : 'B';
    if (a === 30 || b === 30) return a > b ? 'A' : 'B';
    return null;
  }

  function subLabel(team){
    const mine = team==='A'?state.scoreA:state.scoreB;
    const theirs = team==='A'?state.scoreB:state.scoreA;
    if (mine>=20 && theirs>=20 && Math.abs(mine-theirs)<2) return 'DEUCE';
    if (mine>=20 && mine>theirs && mine<21) return 'GAME PT';
    if (mine===20 && theirs<20) return 'GAME PT';
    return '';
  }

  function render(){
    scoreAEl.textContent = state.scoreA;
    scoreBEl.textContent = state.scoreB;
    serveA.classList.toggle('hidden', state.server!=='A');
    serveB.classList.toggle('hidden', state.server!=='B');
    sideA.classList.toggle('leading', state.scoreA > state.scoreB);
    sideB.classList.toggle('leading', state.scoreB > state.scoreA);
    subA.textContent = subLabel('A');
    subB.textContent = subLabel('B');
    gamesLabel.textContent = `${state.gamesA}–${state.gamesB}`;
  }

  function speak(text){
    if (!state.soundOn || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
  }

  function point(team){
    state.history.push({a:state.scoreA,b:state.scoreB,server:state.server});
    if (team==='A') state.scoreA++; else state.scoreB++;
    state.server = team;
    const winner = checkGameOver();

    const myScore = team==='A' ? state.scoreA : state.scoreB;
    const oppScore = team==='A' ? state.scoreB : state.scoreA;
    const sub = subLabel(team);

    if (winner){
      if (winner==='A') state.gamesA++; else state.gamesB++;
      showToast(`Game: ${winner}`);
      speak(`Game, ${winner}. ${state.scoreA} ${state.scoreB}`);
      setTimeout(()=>{ state.scoreA=0; state.scoreB=0; state.server=winner; render(); }, 800);
    } else if (sub === 'DEUCE'){
      speak(`${team}, ${myScore} ${oppScore}. Deuce.`);
    } else if (sub === 'GAME PT'){
      speak(`${team}, ${myScore} ${oppScore}. Game point.`);
    } else {
      speak(`${team}, ${myScore} ${oppScore}`);
    }
    render();
  }

  function undo(){
    const last = state.history.pop();
    if (!last) return;
    state.scoreA=last.a; state.scoreB=last.b; state.server=last.server;
    render();
  }

  sideA.addEventListener('click', ()=> point('A'));
  sideB.addEventListener('click', ()=> point('B'));
  el('undoBtn').addEventListener('click', undo);
  el('soundBtn').addEventListener('click', ()=>{
    state.soundOn = !state.soundOn;
    el('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
    if (!state.soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    else speak('Sound on');
  });
  el('resetBtn').addEventListener('click', ()=>{
    state.scoreA=0; state.scoreB=0; state.gamesA=0; state.gamesB=0; state.history=[];
    render(); showToast('Reset');
  });

  el('firstA').addEventListener('click', ()=>{ state.server='A'; el('setup').classList.add('hidden'); render(); });
  el('firstB').addEventListener('click', ()=>{ state.server='B'; el('setup').classList.add('hidden'); render(); });

  render();
</script>
</body>
</html>
